<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Orbag · Account</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--forest:#0D3D2B;--leaf:#1D9E75;--mint:#E1F5EE;--ink:#0F1A14;--stone:#5A6862;--paper:#F7F5F0;--line:#D8D5CE;--white:#FFFFFF}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
nav{background:var(--forest);padding:0 40px;display:flex;align-items:center;height:60px;gap:32px}
.nav-logo{font-family:'DM Serif Display',serif;font-size:22px;color:#fff;text-decoration:none}
.nav-logo span{color:var(--leaf)}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:40px;width:100%;max-width:460px}
.card-title{font-family:'DM Serif Display',serif;font-size:28px;color:var(--forest);margin-bottom:6px}
.card-sub{font-size:14px;color:var(--stone);margin-bottom:32px}
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:28px}
.tab{flex:1;padding:10px;font-size:13px;font-weight:600;background:var(--white);border:none;cursor:pointer;color:var(--stone);transition:all .15s}
.tab.active{background:var(--forest);color:#fff}
label{display:block;font-size:12px;font-weight:600;color:var(--stone);margin-bottom:6px;margin-top:16px;text-transform:uppercase;letter-spacing:.05em}
label:first-of-type{margin-top:0}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--white);outline:none;transition:border .15s}
input:focus,select:focus{border-color:var(--leaf)}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.role-btn{padding:14px;border:2px solid var(--line);border-radius:8px;background:var(--white);cursor:pointer;text-align:center;transition:all .15s}
.role-btn.selected{border-color:var(--leaf);background:var(--mint)}
.role-btn .icon{font-size:24px;margin-bottom:4px}
.role-btn .label{font-size:13px;font-weight:600;color:var(--ink)}
.btn-primary{width:100%;margin-top:24px;padding:13px;background:var(--leaf);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-primary:hover{background:#178c64}
.msg{margin-top:16px;padding:12px;border-radius:7px;font-size:13px;display:none}
.msg.error{background:#FEE2E2;color:#991B1B;display:block}
.msg.success{background:var(--mint);color:#065F46;display:block}
.profile-wrap{max-width:600px;margin:0 auto;padding:40px 20px;width:100%}
.profile-header{font-family:'DM Serif Display',serif;font-size:32px;color:var(--forest);margin-bottom:6px}
.profile-sub{font-size:14px;color:var(--stone);margin-bottom:32px}
.profile-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:32px;margin-bottom:20px}
.profile-section{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--leaf);margin-bottom:16px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.crops-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.crop-check{padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:12px;cursor:pointer;text-align:center;transition:all .15s;user-select:none}
.crop-check.selected{border-color:var(--leaf);background:var(--mint);font-weight:600}
.btn-ghost{padding:10px 20px;background:transparent;color:var(--stone);border:1px solid var(--line);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .15s}
.btn-ghost:hover{border-color:var(--stone)}
.btn-row{display:flex;gap:12px;justify-content:flex-end;margin-top:8px}
.role-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:24px}
.role-badge.farmer{background:var(--mint);color:var(--forest)}
.role-badge.buyer{background:#E6F1FB;color:#0C447C}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/">orb<span>ag</span></a>
</nav>

<!-- Auth view -->
<div id="authView" class="wrap" style="display:none">
  <div class="card">
    <div class="card-title">Welkom bij Orbag</div>
    <div class="card-sub">Log in of maak een account aan</div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Inloggen</button>
      <button class="tab" onclick="switchTab('register')">Registreren</button>
    </div>

    <div id="loginForm">
      <label>E-mailadres</label>
      <input type="email" id="loginEmail" placeholder="jouw@email.nl"/>
      <label>Wachtwoord</label>
      <input type="password" id="loginPassword" placeholder="••••••••"/>
      <button class="btn-primary" onclick="login()">Inloggen</button>
    </div>

    <div id="registerForm" style="display:none">
      <label>Ik ben een</label>
      <div class="role-grid">
        <div class="role-btn selected" id="roleBoer" onclick="selectRole('farmer')">
          <div class="icon">🌱</div>
          <div class="label">Boer / teler</div>
        </div>
        <div class="role-btn" id="roleKoper" onclick="selectRole('buyer')">
          <div class="icon">🏭</div>
          <div class="label">Koper / afnemer</div>
        </div>
      </div>
      <label>Naam</label>
      <input type="text" id="regName" placeholder="Jouw naam"/>
      <label>Bedrijfsnaam</label>
      <input type="text" id="regCompany" placeholder="Bedrijfsnaam"/>
      <label>E-mailadres</label>
      <input type="email" id="regEmail" placeholder="jouw@email.nl"/>
      <label>Wachtwoord</label>
      <input type="password" id="regPassword" placeholder="Minimaal 8 tekens"/>
      <button class="btn-primary" onclick="register()">Account aanmaken</button>
    </div>

    <div class="msg" id="authMsg"></div>
  </div>
</div>

<!-- Profile view — shown after login -->
<div id="profileView" style="display:none">
  <div class="profile-wrap">
    <div class="profile-header" id="profileName">Mijn profiel</div>
    <div id="roleBadge"></div>

    <!-- Shared fields -->
    <div class="profile-card">
      <div class="profile-section">Bedrijfsgegevens</div>
      <div class="field-grid">
        <div>
          <label>Naam</label>
          <input type="text" id="pName"/>
        </div>
        <div>
          <label>Bedrijf</label>
          <input type="text" id="pCompany"/>
        </div>
        <div>
          <label>Regio</label>
          <select id="pRegion">
            <option value="">Selecteer regio</option>
            <option value="noord_groningen">Noord-Groningen</option>
            <option value="groningen">Groningen</option>
            <option value="friesland">Friesland</option>
            <option value="drenthe">Drenthe</option>
            <option value="flevoland">Flevoland</option>
            <option value="zeeland">Zeeland</option>
            <option value="brabant">Brabant</option>
          </select>
        </div>
        <div id="hectaresField" style="display:none">
          <label>Hectares</label>
          <input type="number" id="pHectares" placeholder="bijv. 120"/>
        </div>
        <div id="sectorField" style="display:none">
          <label>Sector</label>
          <select id="pSector">
            <option value="">Selecteer sector</option>
            <option value="food_processor">Food processor</option>
            <option value="retailer">Retailer / supermarkt</option>
            <option value="catering">Catering / foodservice</option>
            <option value="wholesaler">Groothandel</option>
            <option value="exporter">Exporteur</option>
          </select>
        </div>
        <div id="budgetField" style="display:none">
          <label>Jaarlijks inkoopbudget (€)</label>
          <input type="number" id="pBudget" placeholder="bijv. 5000000"/>
        </div>
      </div>
    </div>

    <!-- Farmer-only fields -->
    <div class="profile-card" id="farmerFields" style="display:none">
      <div class="profile-section">Teelt</div>
      <label>Grondsoort</label>
      <select id="pSoil">
        <option value="">Selecteer grondsoort</option>
        <option value="klei">Zeeklei</option>
        <option value="zand">Zand</option>
        <option value="dal">Dalgrond</option>
        <option value="loss">Löss</option>
        <option value="veen">Veen</option>
      </select>
      <label style="margin-top:16px">Gewassen</label>
      <div class="crops-grid">
        <div class="crop-check" data-crop="green_beans" onclick="toggleCrop(this)">Sperziebonen</div>
        <div class="crop-check" data-crop="wheat" onclick="toggleCrop(this)">Wintertarwe</div>
        <div class="crop-check" data-crop="potatoes" onclick="toggleCrop(this)">Aardappelen</div>
        <div class="crop-check" data-crop="onions" onclick="toggleCrop(this)">Uien</div>
        <div class="crop-check" data-crop="lentils" onclick="toggleCrop(this)">Linzen</div>
        <div class="crop-check" data-crop="oats" onclick="toggleCrop(this)">Haver</div>
        <div class="crop-check" data-crop="peas" onclick="toggleCrop(this)">Erwten</div>
        <div class="crop-check" data-crop="carrots" onclick="toggleCrop(this)">Wortelen</div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-ghost" onclick="logout()">Uitloggen</button>
      <button class="btn-primary" style="width:auto;padding:10px 28px;margin-top:0" onclick="saveProfile()">Opslaan</button>
    </div>
    <div class="msg" id="profileMsg"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://wbysgkfsaoyaaatdgics.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndieXNna2ZzYW95YWFhdGRnaWNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMTYzMzcsImV4cCI6MjA5NTg5MjMzN30.-pz9gyBYvR_PLaKaeTXh-vttFGwiho71NfxNJEGXWns';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentRole = 'farmer';
let selectedCrops = [];
let userRole = null;

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    showProfile(session.user);
  } else {
    document.getElementById('authView').style.display = 'flex';
  }
}

function switchTab(tab) {
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1)));
}

function selectRole(role) {
  currentRole = role;
  document.getElementById('roleBoer').classList.toggle('selected', role === 'farmer');
  document.getElementById('roleKoper').classList.toggle('selected', role === 'buyer');
}

async function login() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return showMsg('authMsg', error.message, 'error');
  showProfile(data.user);
}

async function register() {
  const name = document.getElementById('regName').value;
  const company = document.getElementById('regCompany').value;
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  if (!name || !email || !password) return showMsg('authMsg', 'Vul alle velden in', 'error');
  if (password.length < 8) return showMsg('authMsg', 'Wachtwoord minimaal 8 tekens', 'error');

  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) return showMsg('authMsg', error.message, 'error');

  // Insert profile with correct role
  await sb.from('profiles').upsert({
    id: data.user.id,
    role: currentRole,
    name,
    company
  });

  showMsg('authMsg', 'Account aangemaakt! Check je e-mail om te bevestigen, dan word je automatisch doorgestuurd.', 'success');

  // Wait for email confirmation then redirect — for now show success
  setTimeout(() => {
    const dest = currentRole === 'buyer' ? '/analyse' : '/boer';
    window.location.href = dest;
  }, 3000);
}

async function showProfile(user) {
  document.getElementById('authView').style.display = 'none';
  document.getElementById('profileView').style.display = 'block';

  const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if (!profile) return;

  userRole = profile.role;

  document.getElementById('profileName').textContent = profile.name || 'Mijn profiel';

  // Role badge
  const badge = document.getElementById('roleBadge');
  badge.innerHTML = profile.role === 'farmer'
    ? '<span class="role-badge farmer">🌱 Boer / teler</span>'
    : '<span class="role-badge buyer">🏭 Koper / afnemer</span>';

  // Shared fields
  document.getElementById('pName').value = profile.name || '';
  document.getElementById('pCompany').value = profile.company || '';
  document.getElementById('pRegion').value = profile.region || '';

  // Role-specific fields
  if (profile.role === 'farmer') {
    document.getElementById('farmerFields').style.display = 'block';
    document.getElementById('hectaresField').style.display = 'block';
    document.getElementById('sectorField').style.display = 'none';
    document.getElementById('budgetField').style.display = 'none';
    document.getElementById('pHectares').value = profile.hectares || '';
    document.getElementById('pSoil').value = profile.soil_type || '';
    selectedCrops = profile.crops || [];
    document.querySelectorAll('.crop-check').forEach(el => {
      el.classList.toggle('selected', selectedCrops.includes(el.dataset.crop));
    });
  } else {
    document.getElementById('farmerFields').style.display = 'none';
    document.getElementById('hectaresField').style.display = 'none';
    document.getElementById('sectorField').style.display = 'block';
    document.getElementById('budgetField').style.display = 'block';
    document.getElementById('pSector').value = profile.sector || '';
    document.getElementById('pBudget').value = profile.budget || '';
  }
}

function toggleCrop(el) {
  const crop = el.dataset.crop;
  el.classList.toggle('selected');
  if (selectedCrops.includes(crop)) {
    selectedCrops = selectedCrops.filter(c => c !== crop);
  } else {
    selectedCrops.push(crop);
  }
}

async function saveProfile() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;

  const update = {
    id: session.user.id,
    role: userRole,
    name: document.getElementById('pName').value,
    company: document.getElementById('pCompany').value,
    region: document.getElementById('pRegion').value,
  };

  if (userRole === 'farmer') {
    update.hectares = parseFloat(document.getElementById('pHectares').value) || null;
    update.soil_type = document.getElementById('pSoil').value;
    update.crops = selectedCrops;
  } else {
    update.sector = document.getElementById('pSector').value;
    update.budget = parseFloat(document.getElementById('pBudget').value) || null;
  }

  const { error } = await sb.from('profiles').upsert(update);
  if (error) return showMsg('profileMsg', 'Fout bij opslaan: ' + error.message, 'error');
  showMsg('profileMsg', 'Profiel opgeslagen ✓', 'success');
  setTimeout(() => {
    window.location.href = userRole === 'buyer' ? '/analyse' : '/boer';
  }, 1000);
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = '/';
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type;
}

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Orbag · Account</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sigmar&family=Exo:wght@300;400;500;600&family=Sedgwick+Ave+Display&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--forest:#14302B;--leaf:#56BC3E;--mint:#E8F7E3;--ink:#0F1A14;--stone:#5A6862;--paper:#F5F5D7;--line:#D8D5CE;--white:#FFFFFF}
body{font-family:'Exo',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
nav{background:var(--forest);padding:0 40px;display:flex;align-items:center;height:60px;gap:32px}
.nav-logo{font-family:'Sigmar',cursive;font-size:22px;color:#fff;text-decoration:none}
.nav-logo span{color:var(--leaf)}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:40px;width:100%;max-width:460px}
.card-title{font-family:'Sigmar',cursive;font-size:28px;color:var(--forest);margin-bottom:6px}
.card-sub{font-size:14px;color:var(--stone);margin-bottom:32px}
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:28px}
.tab{flex:1;padding:10px;font-size:13px;font-weight:600;background:var(--white);border:none;cursor:pointer;color:var(--stone);transition:all .15s}
.tab.active{background:var(--forest);color:#fff}
label{display:block;font-size:12px;font-weight:600;color:var(--stone);margin-bottom:6px;margin-top:16px;text-transform:uppercase;letter-spacing:.05em}
label:first-of-type{margin-top:0}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;font-family:'Exo',sans-serif;font-size:14px;color:var(--ink);background:var(--white);outline:none;transition:border .15s}
input:focus,select:focus{border-color:var(--leaf)}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.role-btn{padding:14px;border:2px solid var(--line);border-radius:8px;background:var(--white);cursor:pointer;text-align:center;transition:all .15s}
.role-btn.selected{border-color:var(--leaf);background:var(--mint)}
.role-btn .icon{font-size:24px;margin-bottom:4px}
.role-btn .label{font-size:13px;font-weight:600;color:var(--ink)}
.btn-primary{width:100%;margin-top:24px;padding:13px;background:var(--leaf);color:#fff;border:none;border-radius:8px;font-family:'Exo',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-primary:hover{background:#3ea32a}
.msg{margin-top:16px;padding:12px;border-radius:7px;font-size:13px;display:none}
.msg.error{background:#FEE2E2;color:#991B1B;display:block}
.msg.success{background:var(--mint);color:#2d7a1e;display:block}
.profile-wrap{max-width:600px;margin:0 auto;padding:40px 20px;width:100%}
.profile-header{font-family:'Sigmar',cursive;font-size:32px;color:var(--forest);margin-bottom:6px}
.profile-sub{font-size:14px;color:var(--stone);margin-bottom:32px}
.profile-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:32px;margin-bottom:20px}
.profile-section{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--leaf);margin-bottom:16px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.crops-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.crop-check{padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:12px;cursor:pointer;text-align:center;transition:all .15s;user-select:none}
.crop-check.selected{border-color:var(--leaf);background:var(--mint);font-weight:600}
.btn-ghost{padding:10px 20px;background:transparent;color:var(--stone);border:1px solid var(--line);border-radius:8px;font-family:'Exo',sans-serif;font-size:13px;cursor:pointer;transition:all .15s}
.btn-ghost:hover{border-color:var(--stone)}
.btn-row{display:flex;gap:12px;justify-content:flex-end;margin-top:8px}
.role-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:24px}
.role-badge.farmer{background:var(--mint);color:var(--forest)}
.role-badge.buyer{background:#E6F1FB;color:#0C447C}
</style>
</head>
<body>
<nav>
<a href="/"><img src="/Orbag_logo-05.svg" alt="Orbag" style="height:28px;display:block"/></a>
</nav>

<!-- Auth view -->
<div id="authView" class="wrap" style="display:none">
<div class="card">
<div class="card-title">Welcome to Orbag</div>
<div class="card-sub">Log in or create an account</div>
<div class="tabs">
<button class="tab active" onclick="switchTab('login')">Log in</button>
<button class="tab" onclick="switchTab('register')">Register</button>
</div>

<div id="loginForm">
<label>Email address</label>
<input type="email" id="loginEmail" placeholder="you@email.com"/>
<label>Password</label>
<input type="password" id="loginPassword" placeholder="••••••••"/>
<button class="btn-primary" onclick="login()">Log in</button>
</div>

<div id="registerForm" style="display:none">
<label>I am a</label>
<div class="role-grid">
<div class="role-btn selected" id="roleBoer" onclick="selectRole('farmer')">
<div class="icon">🌱</div>
<div class="label">Farmer / grower</div>
</div>
<div class="role-btn" id="roleKoper" onclick="selectRole('buyer')">
<div class="icon">🏭</div>
<div class="label">Buyer / processor</div>
</div>
</div>
<label>Name</label>
<input type="text" id="regName" placeholder="Your name"/>
<label>Company name</label>
<input type="text" id="regCompany" placeholder="Company name"/>
<label>Country</label>
<input type="text" id="regCountry" placeholder="e.g. Netherlands, United Kingdom, Poland"/>
<label>Email address</label>
<input type="email" id="regEmail" placeholder="you@email.com"/>
<label>Password</label>
<input type="password" id="regPassword" placeholder="At least 8 characters"/>
<button class="btn-primary" onclick="register()">Create account</button>
</div>

<div class="msg" id="authMsg"></div>
</div>
</div>

<!-- Profile view -->
<div id="profileView" style="display:none">
<div class="profile-wrap">
<div class="profile-header" id="profileName">My profile</div>
<div id="roleBadge"></div>

<div class="role-grid" id="profileRoleGrid" style="margin:0 0 18px">
<div class="role-btn" id="profRoleFarmer" onclick="switchProfileRole('farmer')">
<div class="icon">🌱</div>
<div class="label">Farmer / grower</div>
</div>
<div class="role-btn" id="profRoleBuyer" onclick="switchProfileRole('buyer')">
<div class="icon">🏭</div>
<div class="label">Buyer / processor</div>
</div>
</div>

<div class="profile-card">
<div class="profile-section">Company details</div>
<div class="field-grid">
<div>
<label>Name</label>
<input type="text" id="pName"/>
</div>
<div>
<label>Company</label>
<input type="text" id="pCompany"/>
</div>
<div>
<label>Region</label>
<select id="pRegion">
<option value="">Select region</option>
<option value="noord_groningen">Noord-Groningen</option>
<option value="groningen">Groningen</option>
<option value="friesland">Friesland</option>
<option value="drenthe">Drenthe</option>
<option value="flevoland">Flevoland</option>
<option value="zeeland">Zeeland</option>
<option value="brabant">Brabant</option>
</select>
</div>
<div id="hectaresField" style="display:none">
<label>Hectares</label>
<input type="number" id="pHectares" placeholder="e.g. 120"/>
</div>
<div id="sectorField" style="display:none">
<label>Sector</label>
<select id="pSector">
<option value="">Select sector</option>
<option value="food_processor">Food processor</option>
<option value="retailer">Retailer / supermarket</option>
<option value="catering">Catering / foodservice</option>
<option value="wholesaler">Wholesaler</option>
<option value="exporter">Exporter</option>
</select>
</div>
<div id="budgetField" style="display:none">
<label>Annual procurement budget (€)</label>
<input type="number" id="pBudget" placeholder="e.g. 5000000"/>
</div>
</div>
</div>

<div class="profile-card" id="farmerFields" style="display:none">
<div class="profile-section">Cultivation</div>
<label>Soil type</label>
<select id="pSoil">
<option value="">Select soil type</option>
<option value="klei">Marine clay</option>
<option value="zand">Sand</option>
<option value="dal">Reclaimed peat</option>
<option value="loss">Loess</option>
<option value="veen">Peat</option>
</select>
<label style="margin-top:16px">Crops</label>
<div class="crops-grid">
<div class="crop-check" data-crop="green_beans" onclick="toggleCrop(this)">Green beans</div>
<div class="crop-check" data-crop="wheat" onclick="toggleCrop(this)">Winter wheat</div>
<div class="crop-check" data-crop="potatoes" onclick="toggleCrop(this)">Potatoes</div>
<div class="crop-check" data-crop="onions" onclick="toggleCrop(this)">Onions</div>
<div class="crop-check" data-crop="lentils" onclick="toggleCrop(this)">Lentils</div>
<div class="crop-check" data-crop="oats" onclick="toggleCrop(this)">Oats</div>
<div class="crop-check" data-crop="peas" onclick="toggleCrop(this)">Peas</div>
<div class="crop-check" data-crop="carrots" onclick="toggleCrop(this)">Carrots</div>
</div>
</div>

<div class="btn-row">
<button class="btn-ghost" onclick="logout()">Log out</button>
<button class="btn-primary" style="width:auto;padding:10px 28px;margin-top:0" onclick="saveProfile()">Save</button>
</div>
<div class="msg" id="profileMsg"></div>
</div>
</div>

<script>
const SUPABASE_URL = 'https://wbysgkfsaoyaaatdgics.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndieXNna2ZzYW95YWFhdGRnaWNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMTYzMzcsImV4cCI6MjA5NTg5MjMzN30.-pz9gyBYvR_PLaKaeTXh-vttFGwiho71NfxNJEGXWns';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentRole = 'farmer';
let selectedCrops = [];
let userRole = null;

// Lees ?next= parameter uit URL — dit is de pagina waar de gebruiker vandaan kwam
function getNextUrl() {
  const params = new URLSearchParams(window.location.search);
  const next = params.get('next');
  // Alleen interne paden toestaan (geen externe redirects)
  if (next && next.startsWith('/') && !next.startsWith('//')) return next;
  return null;
}

// Redirect na login: ga naar ?next= als die er is, anders op basis van rol
function redirectAfterLogin(role) {
  const next = getNextUrl();
  if (next) {
    window.location.href = next;
  } else {
    window.location.href = role === 'buyer' ? '/analyse' : '/boer';
  }
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    showProfile(session.user);
  } else {
    document.getElementById('authView').style.display = 'flex';
  }
}

function switchTab(tab) {
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1)));
}

function selectRole(role) {
  currentRole = role;
  document.getElementById('roleBoer').classList.toggle('selected', role === 'farmer');
  document.getElementById('roleKoper').classList.toggle('selected', role === 'buyer');
}

async function login() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return showMsg('authMsg', error.message, 'error');

  // Haal rol op en redirect correct
  const { data: profile } = await sb.from('profiles').select('role').eq('id', data.user.id).single();
  const role = profile?.role || 'farmer';
  redirectAfterLogin(role);
}

async function register() {
  const name = document.getElementById('regName').value;
  const company = document.getElementById('regCompany').value;
  const country = document.getElementById('regCountry').value.trim();
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  if (!name || !email || !password) return showMsg('authMsg', 'Please fill in all fields', 'error');
  if (password.length < 8) return showMsg('authMsg', 'Password must be at least 8 characters', 'error');

  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) return showMsg('authMsg', error.message, 'error');

  await sb.from('profiles').upsert({ id: data.user.id, role: currentRole, name, company, country });

  // Auto-bootstrap provisional benchmarks for this country if the platform has nothing for it yet.
  if (country) bootstrapRegion(country);   // fire-and-forget — never blocks signup

  showMsg('authMsg', 'Account created! One moment…', 'success');
  setTimeout(() => redirectAfterLogin(currentRole), 2000);
}

// Ask the backend to set up a provisional benchmark region for a new country. Non-blocking:
// the user proceeds immediately; the region is sharpened asynchronously by research + review.
function bootstrapRegion(country) {
  try {
    fetch('/api/bootstrap-region', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ country: country })
    }).catch(function(){ /* non-blocking */ });
  } catch (e) { /* non-blocking */ }
}

async function showProfile(user) {
  document.getElementById('authView').style.display = 'none';
  document.getElementById('profileView').style.display = 'block';

  const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if (!profile) return;

  userRole = profile.role;
  document.getElementById('profileName').textContent = profile.name || 'My profile';

  document.getElementById('pName').value = profile.name || '';
  document.getElementById('pCompany').value = profile.company || '';
  document.getElementById('pRegion').value = profile.region || '';

  // Populate both farmer and buyer fields so the user can switch role context
  // without losing stored values.
  document.getElementById('pHectares').value = profile.hectares || '';
  document.getElementById('pSoil').value = profile.soil_type || '';
  selectedCrops = profile.crops || [];
  document.querySelectorAll('.crop-check').forEach(el => {
    el.classList.toggle('selected', selectedCrops.includes(el.dataset.crop));
  });
  document.getElementById('pSector').value = profile.sector || '';
  document.getElementById('pBudget').value = profile.budget || '';

  applyRoleView(profile.role || 'farmer');
}

// Show the badge + fields for the given role, and let the user switch context
// between buyer and farmer right here on My Account. Role drives prefill and the
// default landing page only — never navigation (see CLAUDE.md auth/role rule).
function applyRoleView(role) {
  userRole = role;
  const farmer = role === 'farmer';

  document.getElementById('roleBadge').innerHTML = farmer
    ? '<span class="role-badge farmer">🌱 Farmer / grower</span>'
    : '<span class="role-badge buyer">🏭 Buyer / processor</span>';

  const f = document.getElementById('profRoleFarmer');
  const b = document.getElementById('profRoleBuyer');
  if (f) f.classList.toggle('selected', farmer);
  if (b) b.classList.toggle('selected', !farmer);

  document.getElementById('farmerFields').style.display = farmer ? 'block' : 'none';
  document.getElementById('hectaresField').style.display = farmer ? 'block' : 'none';
  document.getElementById('sectorField').style.display = farmer ? 'none' : 'block';
  document.getElementById('budgetField').style.display = farmer ? 'none' : 'block';
}

function switchProfileRole(role) {
  applyRoleView(role);
}

function toggleCrop(el) {
  const crop = el.dataset.crop;
  el.classList.toggle('selected');
  if (selectedCrops.includes(crop)) {
    selectedCrops = selectedCrops.filter(c => c !== crop);
  } else {
    selectedCrops.push(crop);
  }
}

async function saveProfile() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;

  const update = {
    id: session.user.id,
    role: userRole,
    name: document.getElementById('pName').value,
    company: document.getElementById('pCompany').value,
    region: document.getElementById('pRegion').value,
  };

  if (userRole === 'farmer') {
    update.hectares = parseFloat(document.getElementById('pHectares').value) || null;
    update.soil_type = document.getElementById('pSoil').value;
    update.crops = selectedCrops;
  } else {
    update.sector = document.getElementById('pSector').value;
    update.budget = parseFloat(document.getElementById('pBudget').value) || null;
  }

  const { error } = await sb.from('profiles').upsert(update);
  if (error) return showMsg('profileMsg', 'Error saving: ' + error.message, 'error');

  showMsg('profileMsg', 'Profile saved ✓', 'success');
  setTimeout(() => redirectAfterLogin(userRole), 1000);
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = '/';
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type;
}

init();
</script>
</body>
</html>
